<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logowanie – Spotted Koszalin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1b1d21; --muted:#6b7280; --accent:#2563eb; --border:#e3e5e8; --danger:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a8; --accent:#5b8cff; --border:#2c3038; --danger:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; width:100%; max-width:360px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; font-size:14px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:16px; }
  button { margin-top:14px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .err { color:var(--danger); font-size:14px; margin-top:10px; display:none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/logo.jpg" alt="Spotted Koszalin" style="width:72px;height:72px;border-radius:16px;display:block;margin:0 0 14px">
  <h1>Spotted Koszalin</h1>
  <p>Panel moderacji wiadomości</p>
  <input type="password" name="password" placeholder="Hasło" autofocus autocomplete="current-password" required>
  <button type="submit">Zaloguj</button>
  <div class="err" id="err">Nieprawidłowe hasło.</div>
</form>
<script>if (location.search.includes('error')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
